on:
  push:
    branches:
     - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 8

    - uses: gradle/actions/setup-gradle@v4

    # Builds both modules. core is compiled without the client on its classpath,
    # so a toolkit file reaching for a client type fails here rather than being
    # caught by review.
    - name: Build
      run: gradle build

    # Named explicitly: proguard is the client module's task, not the root's.
    - name: Obfuscate
      run: gradle :client-225:proguard

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: client
        path: |
          client-225/build/libs/*

  deob-map:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 21

    - name: Generate deob mapping
      run: |
        cp ref/remap.toml deob.toml
        wget https://github.com/LostCityRS/Deobfuscator/releases/latest/download/Deobfuscator.jar
        java -jar Deobfuscator.jar

    - name: Upload mapping
      uses: actions/upload-artifact@v4
      with:
        name: deob-map
        path: |
          remap.txt
