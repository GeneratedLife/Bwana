// Root project: configuration only, no sources of its own.
//
// Only what every module genuinely shares belongs here. The source level does
// not: 225 upstream compiles as 1.6 and 274 upstream as 1.8, so each client sets
// its own, and core holds itself to the lowest of them so every client can
// consume it. Putting a single level here would have meant one module quietly
// overriding the root, which reads as an accident rather than a decision.

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion.set(JavaLanguageVersion.of(8))
        }
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }
}
