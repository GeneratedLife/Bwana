// Root project: configuration only, no sources of its own.
//
// Everything both modules agree on lives here. The Java level is one of those
// things: the client is rev 225 code and compiles as 1.6 source, and core is
// held to the same level so a module cannot quietly start using a language
// feature the client's compiler will reject.

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion.set(JavaLanguageVersion.of(8))
        }

        sourceCompatibility = JavaVersion.VERSION_1_6
        targetCompatibility = JavaVersion.VERSION_1_6
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }
}
